; Merge into your Apache/FPM PHP configuration and restart the relevant service.
expose_php = Off
display_errors = Off
log_errors = On
allow_url_include = Off
upload_max_filesize = 4M
post_max_size = 5M
max_file_uploads = 1
max_input_vars = 100
max_execution_time = 30
max_input_time = 30
memory_limit = 192M
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_samesite = Lax
; HTTPS production only; app also derives this from base_url.
session.cookie_secure = 1
