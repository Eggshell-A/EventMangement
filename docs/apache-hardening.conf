# Ubuntu Apache 2.4: adapt in your VirtualHost, then apache2ctl configtest.
# Requires: a2enmod headers rewrite reqtimeout. PHP must be configured separately.
# Do not log query strings: email verification bearer tokens arrive on the first GET.
# Use this CustomLog in the site's VirtualHost instead of the default combined format.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" eventlink_no_query
CustomLog ${APACHE_LOG_DIR}/eventlink_access.log eventlink_no_query
# For a localhost Cloudflare Tunnel origin, bind the listener to 127.0.0.1.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 30
KeepAliveTimeout 5
MaxKeepAliveRequests 100
RequestReadTimeout header=10-20,MinRate=500 body=10,MinRate=500
LimitRequestBody 5242880
LimitRequestFields 50
LimitRequestFieldSize 8190
<Directory /var/www/html/EventLink>
    Options -Indexes -ExecCGI
    AllowOverride FileInfo
    Require all granted
</Directory>
# Use these only if the origin listener is reachable exclusively by local cloudflared.
# a2enmod remoteip; these directives restore REMOTE_ADDR for per-client rate limits.
# RemoteIPHeader CF-Connecting-IP
# RemoteIPTrustedProxy 127.0.0.1
# RemoteIPTrustedProxy ::1
# Never trust forwarding headers from all addresses.
