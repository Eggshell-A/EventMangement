# Adapt server_name, root, HTTPS certificates and PHP-FPM socket to your host.
# Install at the host root; subdirectory deployments need adjusted location rules.
# The following zones belong in the http context, outside server blocks.
limit_req_zone $binary_remote_addr zone=fairboard_requests:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=fairboard_connections:10m;
server {
    listen 443 ssl;
    server_name events.example.com;
    root /var/www/EventMangement;
    index index.php;
    # ssl_certificate /private/path/fullchain.pem;
    # ssl_certificate_key /private/path/privkey.pem;
    client_max_body_size 5m;
    autoindex off;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 15s;
    limit_conn fairboard_connections 20;
    limit_conn_status 429;
    limit_req_status 429;
    location ~ /\. { deny all; }
    location ~ ^/(storage|uploads|includes|tools|tests|database|migrations|docs|vendor)(/|$) { deny all; }
    location ~* /(config(\.example)?\.php|composer\.(json|lock)|router\.php|security_test_results\.json)$ { deny all; }
    location ~* \.(sql|md|pem|log|txt|py|cjs)$ { deny all; }
    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ {
        limit_req zone=fairboard_requests burst=30 nodelay;
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
server {
    listen 80;
    server_name events.example.com;
    return 301 https://events.example.com$request_uri;
}
